# Dormant SonarQube Cloud analysis scope.
#
# This file deliberately does not enable a SonarCloud project, token, GitHub
# App, or workflow. If a future main-only CI workflow is explicitly approved,
# it must use this narrow scope and must not enable pull-request or branch
# analysis. Scope is a path boundary, not content redaction: never place PHI,
# PII, or local study data in src/.

# Application source only. Tests can contain fixture-like values and are never
# submitted to the future Cloud analysis scope.
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Defense in depth if the source scope is ever broadened. Keep local studies,
# exports, reports, screenshots, logs, caches, and generated output excluded.
sonar.exclusions=data,test-DICOM-data,sample-DICOM-gitignored,decoder-spike-artifacts,resources/screenshots-ignored,logs,tmp,backups,.sonar-local,.scannerwork,.sonar,.sonarqube,.sonarlint,venv,.venv,env,virtualenv,build,dist,reports,tests,tests/fixtures
