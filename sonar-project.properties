# SonarQube Cloud CI analysis configuration.
#
# This file is used only by .github/workflows/sonarqube-cloud-main.yml, which
# runs for trusted PRs and pushes to main/develop after the privacy gate. It
# does not enable Automatic Analysis; keep that method disabled so analysis is
# never performed independently of the gate.
#
# Scope is a path boundary, not content redaction: never place PHI, PII, or
# local study data in src/.

sonar.organization=kgrizz-git
sonar.projectKey=kgrizz-git_DICOMViewerV3
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Defense in depth if the source scope is ever broadened. These are CI scanner
# glob patterns; tests, coverage, local data, generated files, caches, and
# artifacts must never be submitted to SonarQube Cloud.
sonar.exclusions=**/data/**,**/test-DICOM-data/**,**/sample-DICOM-gitignored/**,**/decoder-spike-artifacts/**,**/resources/screenshots-ignored/**,**/logs/**,**/tmp/**,**/backups/**,**/.sonar-local/**,**/.phi-tools/**,**/.scannerwork/**,**/.sonar/**,**/.sonarqube/**,**/.sonarlint/**,**/venv/**,**/.venv/**,**/env/**,**/virtualenv/**,**/build/**,**/dist/**,**/reports/**,**/tests/**,**/*.dcm,**/*.dicom,**/*.nii,**/*.nii.gz,**/*.nrrd,**/*.mha,**/*.mhd,**/*.csv,**/*.tsv,**/*.xlsx,**/*.xls,**/*.pdf,**/*.png,**/*.jpg,**/*.jpeg,**/*.tif,**/*.tiff
