reviews:
  auto_review:
    enabled: false
  path_filters:
    - "!data/**"
    - "!test-DICOM-data/**"
    - "!sample-DICOM-gitignored/**"
    - "!decoder-spike-artifacts/**"
    - "!resources/screenshots-ignored/**"
    - "!logs/**"
    - "!tmp/**"
    - "!backups/**"
    - "!.sonar-local/**"
    - "!.phi-tools/**"
    - "!**/*.dcm"
    - "!**/*.dicom"
    - "!**/*.nii"
    - "!**/*.nii.gz"
    - "!**/*.nrrd"
    - "!**/*.mha"
    - "!**/*.mhd"
    - "!**/*.csv"
    - "!**/*.tsv"
    - "!**/*.xlsx"
    - "!**/*.xls"
    - "!**/*.pdf"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.tif"
    - "!**/*.tiff"
