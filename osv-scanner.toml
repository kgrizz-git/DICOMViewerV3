# osv-scanner configuration for the "osv-scanner (locked dependencies)" CI job.
#
# security/pip-audit-exceptions.md is the single source of truth for every
# suppression. Each ID below must have a row there, and
# tests/test_osv_scanner_config.py enforces that, plus a reason and a future
# ignoreUntil on every entry. Never add a broad ignore.
#
# OSV also filters the aliases of an ignored ID (CVE-2026-32711 and
# GHSA-v856-2rf8-9f28 for the entry below), so aliases are not listed.

[[IgnoredVulns]]
id = "PYSEC-2026-2266"
ignoreUntil = 2026-12-31
reason = "pydicom 2.4.5, fixed in 3.0.2. pylinac caps pydicom<3 (still true in 3.47.0). Unblocks when a pylinac release allows pydicom 3 and ACR-QA verification is done. See security/pip-audit-exceptions.md."
