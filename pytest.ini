# Pytest configuration for DICOM Viewer V3.
# Run from project root: pytest   (after activating venv and ensuring src is on PYTHONPATH)
# Or use: python tests/run_tests.py

[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
# -n auto parallelizes across CPU cores via pytest-xdist, matching CI so that
# sharding-order bugs surface locally instead of only on PRs. Requires
# requirements-dev.txt. For quick single-test iteration, override with -n 0,
# which runs in-process with no worker startup: pytest -n 0 tests/path/test_x.py
# --dist worksteal lets idle workers take queued tests from busy ones. The
# default (load) pre-assigns batches, so a worker that draws a cluster of slow
# Qt main-window tests ran alone for up to ~5 min on CI while the others idled.
# Measured 2026-10-05, 4 workers + coverage: load 80-88s, worksteal 53-56s.
addopts = -v --tb=short -n auto --dist worksteal
# Ensure tests can import from src when run as: pytest (from project root with PYTHONPATH=src)
# If PYTHONPATH is not set, tests/conftest.py adds src to sys.path
