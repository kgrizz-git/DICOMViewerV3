name: Build Executables

# This workflow builds executables for Windows, macOS, and Linux
# It runs when you push a version tag (e.g., v1.0.0) or manually trigger it

concurrency:
  # Manual publish and tag push for the same tag share one group (e.g. build-v0.4.2).
  # Plain manual/branch runs still key on github.ref.
  group: build-${{ (github.event_name == 'workflow_dispatch' && inputs.publish_to_release && inputs.release_tag_name) || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      publish_to_release:
        description: 'Create/publish a GitHub Release from this run (requires release_tag_name)'
        required: false
        type: boolean
        default: false
      release_tag_name:
        description: 'Version tag for the release, strict form vX.Y.Z or vX.Y.Z-pre (e.g. v1.2.3-rc1). Validated before any build step.'
        required: false
        type: string
        default: ''

jobs:
  prepare_release:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_release == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release inputs
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_release == true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag_name }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          echo "Requested tag: '$TAG'"
          if [ -z "$TAG" ]; then
            echo "Error: release_tag_name is required when publish_to_release is checked." >&2
            exit 1
          fi
          # Strict: no leading-zero X/Y/Z; prerelease identifiers non-empty (no "..").
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-][0-9A-Za-z-]*(\.[0-9A-Za-z-][0-9A-Za-z-]*)*)?$'; then
            echo "Error: tag must match vX.Y.Z or vX.Y.Z-pre (got '$TAG')." >&2
            exit 1
          fi

          # One commit SHA only: peel annotated tags (^{}), else lightweight tag object.
          REMOTE_TAG_SHA=$(
            git ls-remote --tags origin "refs/tags/$TAG" |
            awk -v ref="refs/tags/$TAG" '
              $2 == ref "^{}" { print $1; found=1; exit }
              $2 == ref { lightweight=$1 }
              END { if (!found && lightweight != "") print lightweight }
            '
          )
          if [ -n "$REMOTE_TAG_SHA" ]; then
            if [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Error: tag '$TAG' already exists on origin pointing to a different commit ($REMOTE_TAG_SHA vs $GITHUB_SHA) — refusing. Choose a new version." >&2
              exit 1
            else
              echo "Note: tag '$TAG' already exists on origin pointing to current commit ($GITHUB_SHA). Allowing idempotent re-run."
            fi
          fi

          # Create release shell synchronously to prevent matrix jobs from racing
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release $TAG..."
            PRERELEASE_FLAG=""
            if [[ "$TAG" == *-* ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Release $TAG" --generate-notes $PRERELEASE_FLAG
          else
            echo "Release $TAG already exists."
          fi

  build:
    name: Build on ${{ matrix.os }}
    needs: prepare_release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: DICOMViewerV3-Windows
            executable_path: dist/DICOMViewerV3.exe
          - os: macos-latest
            artifact_name: DICOMViewerV3-macOS
            executable_path: dist/DICOMViewerV3.app
          - os: ubuntu-latest
            artifact_name: DICOMViewerV3-Linux
            executable_path: dist/DICOMViewerV3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          # Single pip cache key across build + PyInstaller deps (reduces orphan caches).
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxrandr2 libxss1 libxcursor1 libxcomposite1 \
            libasound2t64 libxi6 libxtst6 libfuse2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Remove typing package if present (PyInstaller compatibility)
        run: |
          python -m pip uninstall -y typing || true

      - name: Build executable
        shell: bash
        run: |
          pyinstaller DICOMViewerV3.spec --clean --noconfirm

      - name: Download AppImageTool
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Create AppDir structure
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps

      - name: Copy PyInstaller build to AppDir
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp -r dist/DICOMViewerV3/* AppDir/usr/bin/
          chmod +x AppDir/usr/bin/DICOMViewerV3

      - name: Create desktop entry
        if: matrix.os == 'ubuntu-latest'
        run: |
          cat > AppDir/usr/share/applications/DICOMViewerV3.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=DICOM Viewer V3
          Comment=Medical imaging DICOM viewer application
          Exec=DICOMViewerV3
          Icon=DICOMViewerV3
          Categories=Graphics;MedicalSoftware;Viewer;
          Terminal=false
          StartupNotify=true
          MimeType=application/dicom;
          EOF

      - name: Copy .desktop file to AppDir root
        if: matrix.os == 'ubuntu-latest'
        run: cp AppDir/usr/share/applications/DICOMViewerV3.desktop AppDir/DICOMViewerV3.desktop

      - name: Copy icon
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Copy icon to multiple sizes for better desktop environment compatibility
          # Desktop environments will use the appropriate size
          cp resources/icons/dvv6ldvv6ldvv6ld_edit-removebg-preview.png \
             AppDir/usr/share/icons/hicolor/128x128/apps/DICOMViewerV3.png
          cp resources/icons/dvv6ldvv6ldvv6ld_edit-removebg-preview.png \
             AppDir/usr/share/icons/hicolor/256x256/apps/DICOMViewerV3.png
          cp resources/icons/dvv6ldvv6ldvv6ld_edit-removebg-preview.png \
             AppDir/usr/share/icons/hicolor/512x512/apps/DICOMViewerV3.png
          # Also add to scalable directory (desktop environments can scale as needed)
          cp resources/icons/dvv6ldvv6ldvv6ld_edit-removebg-preview.png \
             AppDir/usr/share/icons/hicolor/scalable/apps/DICOMViewerV3.png

      - name: Create AppRun script
        if: matrix.os == 'ubuntu-latest'
        run: |
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/DICOMViewerV3" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag_name }}
          PUBLISH: ${{ inputs.publish_to_release }}
        run: |
          # Extract version from tag if available, otherwise use "latest"
          if [ "$PUBLISH" = "true" ] && [ -n "$RELEASE_TAG" ]; then
            VERSION=$(echo "$RELEASE_TAG" | sed 's/^v//')
          elif [[ "$GH_REF" == refs/tags/* ]]; then
            VERSION=$(echo "$GH_REF" | sed 's/refs\/tags\/v//')
          else
            VERSION="latest"
          fi
          appimagetool AppDir DICOMViewerV3-${VERSION}-x86_64.AppImage
          chmod +x DICOMViewerV3-${VERSION}-x86_64.AppImage
          ls -lh DICOMViewerV3-${VERSION}-x86_64.AppImage

      - name: Verify AppImage exists
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag_name }}
          PUBLISH: ${{ inputs.publish_to_release }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ -n "$RELEASE_TAG" ]; then
            VERSION=$(echo "$RELEASE_TAG" | sed 's/^v//')
          elif [[ "$GH_REF" == refs/tags/* ]]; then
            VERSION=$(echo "$GH_REF" | sed 's/refs\/tags\/v//')
          else
            VERSION="latest"
          fi
          if [ ! -f "DICOMViewerV3-${VERSION}-x86_64.AppImage" ]; then
            echo "Error: AppImage not created"
            exit 1
          fi
          file DICOMViewerV3-${VERSION}-x86_64.AppImage

      - name: Verify executable exists
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            if [ ! -f "dist/DICOMViewerV3/DICOMViewerV3.exe" ]; then
              echo "Error: DICOMViewerV3.exe not found"
              exit 1
            fi
            ls -lh dist/DICOMViewerV3/DICOMViewerV3.exe
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            if [ ! -d "dist/DICOMViewerV3.app" ]; then
              echo "Error: DICOMViewerV3.app not found"
              exit 1
            fi
            ls -lh dist/DICOMViewerV3.app
          else
            if [ ! -f "dist/DICOMViewerV3/DICOMViewerV3" ]; then
              echo "Error: DICOMViewerV3 executable not found"
              exit 1
            fi
            ls -lh dist/DICOMViewerV3/DICOMViewerV3
          fi

      - name: Create ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag_name }}
          PUBLISH: ${{ inputs.publish_to_release }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ -n "$RELEASE_TAG" ]; then
            VERSION=$(echo "$RELEASE_TAG" | sed 's/^v//')
          elif [[ "$GH_REF" == refs/tags/* ]]; then
            VERSION=$(echo "$GH_REF" | sed 's/refs\/tags\/v//')
          else
            VERSION="latest"
          fi
          ZIP_NAME="DICOMViewerV3-${VERSION}-Windows.zip"
          python -m zipfile -c "${ZIP_NAME}" dist/DICOMViewerV3
          ls -lh "${ZIP_NAME}"

      - name: Create DMG (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag_name }}
          PUBLISH: ${{ inputs.publish_to_release }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ -n "$RELEASE_TAG" ]; then
            VERSION=$(echo "$RELEASE_TAG" | sed 's/^v//')
          elif [[ "$GH_REF" == refs/tags/* ]]; then
            VERSION=$(echo "$GH_REF" | sed 's/refs\/tags\/v//')
          else
            VERSION="latest"
          fi
          DMG_NAME="DICOMViewerV3-${VERSION}-macOS.dmg"
          rm -rf packaging/macos
          mkdir -p packaging/macos
          cp -R dist/DICOMViewerV3.app packaging/macos/
          hdiutil create -volname "DICOMViewerV3" -srcfolder packaging/macos -ov -format UDZO "${DMG_NAME}"
          ls -lh "${DMG_NAME}"

      - name: Verify DMG contents (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag_name }}
          PUBLISH: ${{ inputs.publish_to_release }}
        run: |
          if [ "$PUBLISH" = "true" ] && [ -n "$RELEASE_TAG" ]; then
            VERSION=$(echo "$RELEASE_TAG" | sed 's/^v//')
          elif [[ "$GH_REF" == refs/tags/* ]]; then
            VERSION=$(echo "$GH_REF" | sed 's/refs\/tags\/v//')
          else
            VERSION="latest"
          fi
          DMG_NAME="DICOMViewerV3-${VERSION}-macOS.dmg"
          MOUNT_POINT=$(mktemp -d /tmp/dvv3-dmg.XXXXXX)
          hdiutil attach "${DMG_NAME}" -mountpoint "${MOUNT_POINT}" -nobrowse -readonly
          if [ ! -d "${MOUNT_POINT}/DICOMViewerV3.app" ]; then
            echo "Error: DICOMViewerV3.app not found in DMG"
            hdiutil detach "${MOUNT_POINT}" -quiet || true
            exit 1
          fi
          EXTRA_ITEMS=$(ls -A "${MOUNT_POINT}" | rg -v '^DICOMViewerV3\.app$' || true)
          if [ -n "${EXTRA_ITEMS}" ]; then
            echo "Error: unexpected items found in DMG root:"
            echo "${EXTRA_ITEMS}"
            hdiutil detach "${MOUNT_POINT}" -quiet || true
            exit 1
          fi
          hdiutil detach "${MOUNT_POINT}" -quiet
          rm -rf "${MOUNT_POINT}"

      - name: Log distribution sizes
        shell: bash
        run: |
          set -e
          echo "=== PyInstaller dist output sizes (du) ==="
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            du -sh dist/DICOMViewerV3 2>/dev/null || true
            du -sh dist/DICOMViewerV3/DICOMViewerV3.exe 2>/dev/null || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            du -sh dist/DICOMViewerV3.app 2>/dev/null || true
            du -sh dist/DICOMViewerV3* 2>/dev/null || true
            echo "=== macOS .app bundle drill-down (best-effort; paths may vary) ==="
            if [ -d "dist/DICOMViewerV3.app/Contents" ]; then
              du -sh dist/DICOMViewerV3.app/Contents/* 2>/dev/null | sort -h || true
            fi
            if [ -d "dist/DICOMViewerV3.app/Contents/MacOS" ]; then
              du -sh dist/DICOMViewerV3.app/Contents/MacOS/* 2>/dev/null | sort -h || true
            fi
            if [ -d "dist/DICOMViewerV3.app/Contents/Frameworks" ]; then
              du -sh dist/DICOMViewerV3.app/Contents/Frameworks/* 2>/dev/null | sort -h || true
              echo "=== macOS: top 10 largest under Frameworks/ (descending) ==="
              du -sh dist/DICOMViewerV3.app/Contents/Frameworks/* 2>/dev/null | sort -hr | head -10 || true
            fi
            if [ -d "dist/DICOMViewerV3.app/Contents/Resources" ]; then
              echo "=== macOS: top 10 largest under Resources/ (descending) ==="
              du -sh dist/DICOMViewerV3.app/Contents/Resources/* 2>/dev/null | sort -hr | head -10 || true
            fi
          else
            du -sh dist/DICOMViewerV3 2>/dev/null || true
            du -sh dist/DICOMViewerV3/DICOMViewerV3 2>/dev/null || true
          fi

      # Windows artifact: one-folder PyInstaller output
      - name: Upload build artifacts (Windows)
        if: matrix.os == 'windows-latest' && inputs.publish_to_release != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/DICOMViewerV3*
          # Releases remain canonical via softprops/action-gh-release; shorter retention limits GB-hours.
          retention-days: 30

      # macOS artifact: DMG containing only DICOMViewerV3.app
      - name: Upload build artifacts (macOS)
        if: matrix.os == 'macos-latest' && inputs.publish_to_release != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            DICOMViewerV3-*-macOS.dmg
          retention-days: 30

      # Linux artifact: AppImage only
      - name: Upload build artifacts (Linux)
        if: matrix.os == 'ubuntu-latest' && inputs.publish_to_release != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            DICOMViewerV3-*-x86_64.AppImage
          retention-days: 30

      - name: Create Release (Windows, tag push or manual publish)
        if: (startsWith(github.ref, 'refs/tags/') || inputs.publish_to_release == true) && matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            DICOMViewerV3-*-Windows.zip
          tag_name: ${{ inputs.release_tag_name || github.ref_name }}
          name: Release ${{ inputs.release_tag_name || github.ref_name }}
          # Any semver pre-release suffix ("vX.Y.Z-…") publishes as a pre-release; the
          # strict validation regex guarantees "-" can only appear as the pre-release delimiter.
          # Branch names can contain "-", so the manual-publish branch keys off the input, not ref_name.
          prerelease: ${{ ((inputs.publish_to_release == true) && contains(inputs.release_tag_name, '-')) || (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')) }}
          overwrite_files: true
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (macOS DMG, tag push or manual publish)
        if: (startsWith(github.ref, 'refs/tags/') || inputs.publish_to_release == true) && matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            DICOMViewerV3-*-macOS.dmg
          tag_name: ${{ inputs.release_tag_name || github.ref_name }}
          name: Release ${{ inputs.release_tag_name || github.ref_name }}
          # Any semver pre-release suffix ("vX.Y.Z-…") publishes as a pre-release; the
          # strict validation regex guarantees "-" can only appear as the pre-release delimiter.
          # Branch names can contain "-", so the manual-publish branch keys off the input, not ref_name.
          prerelease: ${{ ((inputs.publish_to_release == true) && contains(inputs.release_tag_name, '-')) || (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')) }}
          overwrite_files: true
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (Linux AppImage, tag push or manual publish)
        if: (startsWith(github.ref, 'refs/tags/') || inputs.publish_to_release == true) && matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            DICOMViewerV3-*-x86_64.AppImage
          tag_name: ${{ inputs.release_tag_name || github.ref_name }}
          name: Release ${{ inputs.release_tag_name || github.ref_name }}
          # Any semver pre-release suffix ("vX.Y.Z-…") publishes as a pre-release; the
          # strict validation regex guarantees "-" can only appear as the pre-release delimiter.
          # Branch names can contain "-", so the manual-publish branch keys off the input, not ref_name.
          prerelease: ${{ ((inputs.publish_to_release == true) && contains(inputs.release_tag_name, '-')) || (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')) }}
          overwrite_files: true
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
