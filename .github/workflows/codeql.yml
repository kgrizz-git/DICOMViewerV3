name: CodeQL

# Advanced setup replaces the GitHub default-setup so that the privacy gate
# runs inline before any source is analyzed or uploaded to code scanning.
# Mirrors the pattern in semgrep.yml and sonarqube-cloud-main.yml.

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'user-docs/**'
      - 'dev-docs/**'
      - 'plans/**'
      - 'logs/**'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'user-docs/**'
      - 'dev-docs/**'
      - 'plans/**'
      - 'logs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # Privacy gate: same inline checks as semgrep.yml — no source is analyzed
      # or uploaded until these pass.
      - name: Install PHI scan parsers
        run: python -m pip install "pydicom>=2.4.0,<3" "openpyxl>=3.1.5" "pypdf>=6.14.2,<7"

      - name: PHI artifact check
        run: python scripts/check_no_phi_artifacts.py

      - name: Privacy output check
        run: python scripts/git_hook_privacy_checks.py --all --critical

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: ${{ matrix.language }}

      # Autobuild is not needed for interpreted languages (Python) or workflow
      # files (actions), but skipping it explicitly avoids a confusing no-op.
      - name: Autobuild
        if: matrix.language != 'python' && matrix.language != 'actions'
        uses: github/codeql-action/autobuild@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          category: "/language:${{ matrix.language }}"
